<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador de Cortesías</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f14;--surface:#161922;--surface2:#1e2330;--border:#2a3045;
    --accent:#00c896;--text:#e8ecf4;--muted:#6b7591;--warn:#ffb547;--bad:#ff4f6a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:0 0 60px}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:26px 40px;display:flex;align-items:center;gap:14px}
  .logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#0d0f14;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:1.5px;line-height:1}
  header h1 span{color:var(--accent)}
  header p{font-size:.8rem;color:var(--muted);margin-top:2px}

  .tabs{display:flex;padding:0 40px;background:var(--surface);border-bottom:2px solid var(--border)}
  .tab-btn{padding:16px 28px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;letter-spacing:.5px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;transition:all .2s;margin-bottom:-2px}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

  .tab-content{display:none;padding:40px;max-width:560px;margin:0 auto}
  .tab-content.active{display:block}

  .calc-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
  .calc-card h2{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1.5px;margin-bottom:26px;display:flex;align-items:center;gap:10px}
  .calc-card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}

  .form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  label{font-size:.76rem;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
  select, input[type=number]{background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;padding:13px 16px;width:100%;outline:none;transition:border-color .2s}
  select:focus, input[type=number]:focus{border-color:var(--accent)}
  .input-wrap{position:relative}
  .input-wrap .cur{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.95rem;pointer-events:none}
  .input-wrap input{padding-left:38px}

  .badge{font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.3px;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--muted);text-transform:none}
  .badge.adicional{background:rgba(255,181,71,.15);color:var(--warn);border:1px solid rgba(255,181,71,.4)}

  .divider{height:1px;background:var(--border);margin:22px 0}

  /* Bloque condicional (solo visible desde la 5ta cortesía) */
  .extra-block{display:none;flex-direction:column;gap:0}
  .extra-block.show{display:flex}
  .extra-block .form-group{margin-bottom:14px}

  .threshold-note{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:.78rem;color:var(--muted);margin-bottom:18px;line-height:1.5}
  .threshold-note strong{color:var(--text)}

  button{width:100%;background:var(--accent);color:#0d0f14;font-family:'DM Sans',sans-serif;font-weight:700;letter-spacing:.3px;border:none;padding:14px;border-radius:10px;font-size:.95rem;cursor:pointer;margin-top:6px;transition:opacity .15s, transform .1s}
  button:hover{opacity:.9}
  button:active{transform:scale(0.99)}

  .result-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:10px;background:var(--surface2);margin-top:22px;margin-bottom:12px;display:none}
  .result-row.show{display:flex}
  .result-row .lbl{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.3px}
  .result-row .val{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.5px}
  .result-row.ok{background:rgba(0,200,150,.1);border:1px solid rgba(0,200,150,.35)}
  .result-row.ok .lbl,.result-row.ok .val{color:var(--accent)}
  .result-row.bad{background:rgba(255,60,90,.12);border:1px solid rgba(255,60,90,.45)}
  .result-row.bad .lbl,.result-row.bad .val{color:var(--bad)}

  .note-box{margin-top:12px;border-radius:10px;padding:16px 18px;font-size:.84rem;line-height:1.6;display:none;gap:12px;align-items:flex-start}
  .note-box.show{display:flex}
  .note-box .ic{font-size:1.2rem;flex-shrink:0;margin-top:1px}
  .note-box.warn{background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.3);color:#d8dce8}
  .note-box.warn strong{color:var(--warn)}
  .note-box.ok{background:rgba(0,200,150,.08);border:1px solid rgba(0,200,150,.3);color:#d8dce8}
  .note-box.ok strong{color:var(--accent)}
  .note-box.bad{background:rgba(255,60,90,.1);border:1px solid rgba(255,60,90,.35);color:#d8dce8}
  .note-box.bad strong{color:var(--bad)}

  @media(max-width:600px){
    header{padding:20px}
    header h1{font-size:1.5rem}
    .tabs{padding:0 16px}
    .tab-btn{padding:14px 14px;font-size:.78rem}
    .tab-content{padding:18px}
    .calc-card{padding:20px}
  }
</style>
</head>
<body>

<header>
  <div class="logo">V</div>
  <div>
    <h1>VALIDADOR DE <span>CORTESÍAS</span></h1>
    <p>Condiciones para cortesías adicionales por país</p>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchPais('CO',this)">🇨🇴 Colombia</button>
  <button class="tab-btn" onclick="switchPais('MX',this)">🇲🇽 México</button>
  <button class="tab-btn" onclick="switchPais('PE',this)">🇵🇪 Perú</button>
</div>

<div class="tab-content active">
  <div class="calc-card">
    <h2><span class="dot"></span>Validación de cortesía</h2>

    <div class="form-group">
      <label>Nivel del usuario</label>
      <select id="nivel">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>

    <div class="form-group">
      <label>Cortesías recibidas en el año</label>
      <select id="cortesias" onchange="actualizarEstado()">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="adicional">Adicional</option>
      </select>
    </div>

    <div class="divider"></div>

    <!-- Bloque condicional: solo aparece a partir de la 5ta cortesía -->
    <div class="extra-block" id="extraBlock">
      <div class="threshold-note" id="umbralesTexto"></div>

      <div class="form-group">
        <label>Depósito único más alto</label>
        <div class="input-wrap"><span class="cur" id="curUnico">$</span><input type="number" id="depositoUnico" placeholder="0" oninput="validar()"></div>
      </div>
      <div class="form-group">
        <label>Depósitos acumulados</label>
        <div class="input-wrap"><span class="cur" id="curAcumulado">$</span><input type="number" id="depositoAcumulado" placeholder="0" oninput="validar()"></div>
      </div>
      <div class="form-group">
        <label>NGR del usuario (últimos 30 días)</label>
        <div class="input-wrap"><span class="cur" id="curNgr">$</span><input type="number" id="ngr" placeholder="Ej: 150000" oninput="validar()"></div>
      </div>
    </div>

    <button onclick="validar()">Validar cortesía</button>

    <div class="result-row" id="resultadoRow">
      <span class="lbl" id="resultadoLbl">Estado</span>
      <span class="val" id="resultadoVal">—</span>
    </div>

    <div class="note-box" id="notaDeposito"></div>
    <div class="note-box" id="notaNgr"></div>
  </div>
</div>

<script>
  const UMBRALES = {
    CO: { unico: 500000,   acumulado: 1500000, moneda: '$' },
    MX: { unico: 2000,     acumulado: 6000,    moneda: '$' },
    PE: { unico: 400,      acumulado: 1200,    moneda: 'S/' }
  };

  let paisActual = 'CO';

  function fmt(valor, moneda){
    return moneda + Number(valor).toLocaleString('es');
  }

  function switchPais(pais, btn){
    paisActual = pais;
    document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
    btn.classList.add('active');

    const u = UMBRALES[pais];
    document.getElementById('curUnico').textContent = u.moneda;
    document.getElementById('curAcumulado').textContent = u.moneda;
    document.getElementById('curNgr').textContent = u.moneda;

    actualizarEstado();
  }

  function esAdicional(){
    return document.getElementById('cortesias').value === 'adicional';
  }

  function actualizarEstado(){
    const extraBlock = document.getElementById('extraBlock');

    if (esAdicional()) {
      extraBlock.classList.add('show');
    } else {
      extraBlock.classList.remove('show');
    }

    const u = UMBRALES[paisActual];
    document.getElementById('umbralesTexto').innerHTML =
      `Umbral (${paisActual}): depósito único ≥ <strong>${fmt(u.unico,u.moneda)}</strong> &nbsp;o&nbsp; acumulado ≥ <strong>${fmt(u.acumulado,u.moneda)}</strong>`;

    validar();
  }

  function validar(){
    const resultadoRow = document.getElementById('resultadoRow');
    const resultadoLbl = document.getElementById('resultadoLbl');
    const resultadoVal = document.getElementById('resultadoVal');
    const notaDeposito = document.getElementById('notaDeposito');
    const notaNgr = document.getElementById('notaNgr');

    resultadoRow.className = 'result-row show';
    notaDeposito.className = 'note-box';
    notaNgr.className = 'note-box';

    // Caso 1: cortesías 1 a 4 -> aprobación directa
    if (!esAdicional()) {
      resultadoRow.classList.add('ok');
      resultadoLbl.textContent = 'Cortesía estándar';
      resultadoVal.textContent = 'Aprobada';
      return;
    }

    // Caso 2: cortesía adicional -> requiere condición de depósito + NGR
    const u = UMBRALES[paisActual];
    const depositoUnico = parseFloat(document.getElementById('depositoUnico').value) || 0;
    const depositoAcumulado = parseFloat(document.getElementById('depositoAcumulado').value) || 0;
    const ngrInput = document.getElementById('ngr').value;
    const ngr = ngrInput === '' ? null : parseFloat(ngrInput);

    const cumpleUnico = depositoUnico >= u.unico;
    const cumpleAcumulado = depositoAcumulado >= u.acumulado;
    const cumpleDeposito = cumpleUnico || cumpleAcumulado;

    if (cumpleDeposito) {
      resultadoRow.classList.add('ok');
      resultadoLbl.textContent = 'Cortesía adicional';
      resultadoVal.textContent = 'Cumple depósito';

      notaDeposito.classList.add('show','ok');
      notaDeposito.innerHTML = `<span class="ic">✅</span><div><strong>Condición de depósito cumplida:</strong> ${cumpleUnico ? `depósito único de ${fmt(depositoUnico,u.moneda)}` : `acumulado de ${fmt(depositoAcumulado,u.moneda)}`} supera el umbral requerido.</div>`;

      notaNgr.classList.add('show');
      if (ngr === null) {
        notaNgr.classList.add('warn');
        notaNgr.innerHTML = `<span class="ic">⚠️</span><div><strong>Importante:</strong> valida que el NGR del usuario en los últimos 30 días sea positivo para aprobar por rush. Aún no ingresaste el NGR.</div>`;
      } else if (ngr > 0) {
        notaNgr.classList.add('ok');
        notaNgr.innerHTML = `<span class="ic">✅</span><div>NGR de los últimos 30 días: <strong>${fmt(ngr,u.moneda)}</strong> (positivo). Cumple el requisito para rush.</div>`;
      } else {
        notaNgr.classList.add('bad');
        notaNgr.innerHTML = `<span class="ic">⛔</span><div>NGR de los últimos 30 días: <strong>${fmt(ngr,u.moneda)}</strong> (no positivo). No cumple el requisito para rush.</div>`;
      }
    } else {
      resultadoRow.classList.add('bad');
      resultadoLbl.textContent = 'Cortesía adicional';
      resultadoVal.textContent = 'No cumple';

      notaDeposito.classList.add('show','bad');
      notaDeposito.innerHTML = `<span class="ic">⛔</span><div>Ninguna condición de depósito se cumple: único ${fmt(depositoUnico,u.moneda)} (req. ≥ ${fmt(u.unico,u.moneda)}) ni acumulado ${fmt(depositoAcumulado,u.moneda)} (req. ≥ ${fmt(u.acumulado,u.moneda)}).</div>`;
    }
  }

  switchPais('CO', document.querySelector('.tab-btn'));
</script>

</body>
</html>
